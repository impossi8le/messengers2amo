# HTTP bootstrap only; adapt the existing vhost if one already owns this name.
# Install the log_format and server together under nginx's http context.
# Do not log query strings, client identities, auth headers or message bodies.
log_format messengers2amo_safe '$time_iso8601 $request_method $status '
                             '$body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name messengers.example.com;

    access_log /var/log/nginx/messengers2amo.access.log messengers2amo_safe;
    # Error logs can contain request URLs; keep critical-only until redaction is verified.
    error_log /var/log/nginx/messengers2amo.error.log crit;
    client_max_body_size 20m;

    location / {
        # Proposed host port; verify ss -lntp and the release manifest before use.
        proxy_pass http://127.0.0.1:18767;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Application must validate webhook signatures and authorize admin/media routes.
        # Do not add blanket Basic Auth here: it would block provider webhooks.
    }
}
