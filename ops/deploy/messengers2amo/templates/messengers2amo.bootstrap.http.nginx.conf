# messengers2amo — HTTP-only bootstrap vhost (phase 1 of DEP04).
#
# Why this file exists: `messengers2amo.http.nginx.conf` references
# /etc/letsencrypt/live/messengers.example.com/fullchain.pem in its
# HTTPS block. On a first install that file does not exist yet, so
# `nginx -t` would fail and nginx could not be reloaded at all.
#
# Use this minimal vhost ONLY to (a) give certbot a server block for the domain
# and (b) let HTTP validation through. After the certificate exists, replace it
# with the full template. See DEPLOY-RUNBOOK.md §5–§6.

server {
    listen 80;
    listen [::]:80;
    server_name messengers.example.com;

    access_log /var/log/nginx/messengers2amo.access.log;
    error_log  /var/log/nginx/messengers2amo.error.log warn;

    # Served during ACME validation; harmless afterwards.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    # No redirect yet: HTTPS does not exist until §6. A 301 here would send
    # every visitor (and any ACME HTTP-01 fallback) to a broken endpoint.
    location / {
        return 503;
    }
}
