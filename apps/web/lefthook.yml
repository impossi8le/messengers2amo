pre-commit:
  parallel: true
  commands:
    biome:
      glob: "apps/web/**/*.{ts,tsx,json,scss}"
      run: npx --prefix apps/web biome check --write --staged --no-errors-on-unmatched
    typecheck:
      glob: "apps/web/**/*.{ts,tsx}"
      run: npm --prefix apps/web run typecheck
pre-push:
  commands:
    test:
      run: npm --prefix apps/web test
